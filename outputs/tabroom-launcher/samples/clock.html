<!doctype html><html lang="ko"><meta charset="utf-8"><title>서울 시계</title><link rel="icon" href="clock.png"><style>*{box-sizing:border-box}body{margin:0;font-family:'Avenir Next','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--fg);padding:4.5vh 6vw}header{border-bottom:1px solid currentColor;padding-bottom:2vh;display:flex;justify-content:space-between;font-size:clamp(16px,2.2vw,32px);font-weight:600}main{min-height:65vh;display:flex;flex-direction:column;justify-content:center}h1{font-weight:500;letter-spacing:-.07em;font-size:clamp(40px,7vw,100px);margin:0 0 3vh}.time{font-size:clamp(64px,14vw,230px);line-height:1;font-weight:550;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.palette{display:flex;gap:1vw}.swatch{height:31vh;flex:1;display:flex;align-items:flex-end;padding:1vw;border-radius:1vw;font-size:1.6vw}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1vh}.calendar span{padding:.6vh .8vw;font-size:2vw}.today{background:#4c6298;color:white;border-radius:.5vw}footer{font-size:1.6vw}</style><body style="--bg:#e8f1e8;--fg:#244b40"><header><span>Seoul Time</span><span>서울 시계</span></header><main><h1>서울</h1><div class="time"></div><div style="height:3vh;background:#cfdfd4;margin-top:3vh;border-radius:20px;overflow:hidden"><div id="progress" style="height:100%;background:#589d83"></div></div><script>function tick(){const t=new Date();document.querySelector(".time").textContent=t.toLocaleTimeString("en-GB",{timeZone:"Asia/Seoul"});progress.style.width=(t.getTime()%6000)/60+"%"}function animate(){tick();requestAnimationFrame(animate)}requestAnimationFrame(animate)</script></main></body></html>
