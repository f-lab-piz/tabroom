<!doctype html><html lang="ko"><meta charset="utf-8"><title>움직이는 팔레트</title><link rel="icon" href="color.png"><style>*{box-sizing:border-box}body{margin:0;font-family:'Avenir Next','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--fg);padding:4.5vh 6vw}header{border-bottom:1px solid currentColor;padding-bottom:2vh;display:flex;justify-content:space-between;font-size:clamp(16px,2.2vw,32px);font-weight:600}main{min-height:65vh;display:flex;flex-direction:column;justify-content:center}h1{font-weight:500;letter-spacing:-.07em;font-size:clamp(40px,7vw,100px);margin:0 0 3vh}.time{font-size:clamp(64px,14vw,230px);line-height:1;font-weight:550;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.palette{display:flex;gap:1vw}.swatch{height:31vh;flex:1;display:flex;align-items:flex-end;padding:1vw;border-radius:1vw;font-size:1.6vw}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1vh}.calendar span{padding:.6vh .8vw;font-size:2vw}.today{background:#4c6298;color:white;border-radius:.5vw}footer{font-size:1.6vw}</style><body style="--bg:#fff5e9;--fg:#644239"><header><span>Color Notes</span><span>움직이는 팔레트</span></header><main><h1>움직이는 팔레트</h1><div class="palette"><div class="swatch"></div><div class="swatch"></div><div class="swatch"></div><div class="swatch"></div><div class="swatch"></div></div><script>const cards=[...document.querySelectorAll(".swatch")];function draw(){const t=Date.now()/700;cards.forEach((c,i)=>{const h=Math.floor(t*14+i*32)%360;c.style.background="hsl("+h+" 60% 75%)";c.style.transform="translateY("+Math.sin(t+i)*2+"vh)";c.textContent=h+"°"})}function animate(){draw();requestAnimationFrame(animate)}requestAnimationFrame(animate)</script></main></body></html>
